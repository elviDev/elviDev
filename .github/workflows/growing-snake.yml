name: Generate Growing Snake

on:
  schedule:
    - cron: "0 0 * * *" # once a day at midnight UTC
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install Pillow

      - name: Generate growing snake GIF
        run: python scripts/generate_growing_snake.py --user ${{ github.repository_owner }} --token ${{ secrets.GITHUB_TOKEN }} --out dist/growing-snake.gif

      - name: Push output to the snake-output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: growing-snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
